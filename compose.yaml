# Środowisko deweloperskie: php 8.5 + apache, mariadb, mailpit.
# Porty na hoście można zmienić zmiennymi HZ_*_PORT.
services:
  php:
    build:
      context: docker/php
    volumes:
      - ./:/app
    ports:
      - "${HZ_HTTP_PORT:-8090}:80"
    depends_on:
      db:
        condition: service_healthy
      mailer:
        condition: service_started
    environment:
      COMPOSER_HOME: /var/www/.composer

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: halo
      MARIADB_USER: halo
      MARIADB_PASSWORD: halo
    ports:
      - "${HZ_DB_PORT:-3317}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mailer:
    image: axllent/mailpit:latest
    ports:
      - "${HZ_MAILPIT_PORT:-8035}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db-data:
