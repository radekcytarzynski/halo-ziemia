security:
    password_hashers:
        App\Entity\AdminUser: 'auto'

    providers:
        admin_users:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets)/
            security: false
        # API agentów: bezstanowe, bez sesji/ciasteczek/CSRF, token w "Authorization: Bearer".
        api:
            pattern: ^/api/
            stateless: true
            provider: admin_users # nieużywany: DeviceTokenHandler sam dostarcza użytkownika
            entry_point: App\Security\ApiAuthenticationHandler
            access_token:
                token_handler: App\Security\DeviceTokenHandler
                failure_handler: App\Security\ApiAuthenticationHandler
        main:
            lazy: true
            provider: admin_users
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/api/, roles: ROLE_DEVICE }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/agent/, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Entity\AdminUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
