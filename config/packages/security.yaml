security:
    password_hashers:
        App\Entity\AdminUser: 'auto'

    providers:
        admin_users:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets)/
            security: false
        # Firewall API (etap 2): bezstanowy, token urządzenia w nagłówku Authorization.
        main:
            lazy: true
            provider: admin_users
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Entity\AdminUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
